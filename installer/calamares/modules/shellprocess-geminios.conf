# ============================================================
# Gemini OS — Post-Install Shell Process Module
# Enables all Gemini OS services after installation
# ============================================================

dontChroot: false

script:
  - command: "systemctl enable gemini-orchestrator.service"
    timeout: 30
  - command: "systemctl enable gemini-router.service"
    timeout: 30
  - command: "systemctl enable gemini-network.service"
    timeout: 30
  - command: "systemctl enable gemini-battery.service"
    timeout: 30
  - command: "systemctl enable gemini-thermal.service"
    timeout: 30
  - command: "systemctl enable gemini-memory.service"
    timeout: 30
  - command: "systemctl enable gemini-security.service"
    timeout: 30
  - command: "systemctl enable gemini-self-evolve.service"
    timeout: 30
  - command: "systemctl enable gemini-voice.service"
    timeout: 30
  - command: "systemctl enable ollama.service"
    timeout: 30
  - command: "systemctl enable NetworkManager.service"
    timeout: 30
  - command: "systemctl enable bluetooth.service"
    timeout: 30
  - command: "systemctl enable docker.service"
    timeout: 30
  - command: "/usr/local/bin/gemini-post-install"
    timeout: 120
