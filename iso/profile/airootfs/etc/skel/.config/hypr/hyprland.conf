# ============================================================
# Gemini OS — Hyprland Configuration
# Futuristic AI-Native Desktop Environment
# ============================================================

monitor = , preferred, auto, 1

# --- Startup Services ---
exec-once = waybar &
exec-once = mako &
exec-once = nm-applet --indicator &
exec-once = /usr/local/bin/gemini-shell &
exec-once = swww init && swww img /usr/share/geminios/wallpapers/default.png
exec-once = systemctl --user start gemini-orchestrator.service
exec-once = systemctl --user start gemini-voice.service

# --- Environment ---
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND, wayland
env = MOZ_ENABLE_WAYLAND, 1

# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- General ---
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(00C8FFEE) rgba(7B2FFFAA) 45deg
    col.inactive_border = rgba(30303066)
    layout = dwindle
    allow_tearing = false
}

# --- Decoration (Glass Morphism) ---
decoration {
    rounding = 14

    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        xray = false
    }

    drop_shadow = true
    shadow_range = 25
    shadow_render_power = 3
    col.shadow = rgba(00000055)
}

# --- Animations ---
animations {
    enabled = true
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.4, 0.8, 0.2, 1.2

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 10, default
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 6, overshot, slidevert
}

# --- Layout ---
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

# --- Window Rules ---
# Gemini AI Shell — always floating centered
windowrule = float, ^(gemini-shell)$
windowrule = center, ^(gemini-shell)$
windowrule = size 60% 70%, ^(gemini-shell)$
windowrule = animation slide, ^(gemini-shell)$

# Terminal — only shown on demand, floating
windowrule = float, ^(foot)$
windowrule = center, ^(foot)$
windowrule = size 50% 55%, ^(foot)$

windowrule = float, ^(kitty)$
windowrule = center, ^(kitty)$
windowrule = size 50% 55%, ^(kitty)$

# File manager
windowrule = float, ^(thunar)$
windowrule = size 55% 60%, ^(thunar)$

# --- Key Bindings ---
$mainMod = SUPER

# AI Shell (primary interaction — replaces traditional launcher)
bind = $mainMod, SPACE, exec, /usr/local/bin/gemini-shell-toggle

# App launcher (fallback)
bind = $mainMod, R, exec, rofi -show drun -theme /etc/skel/.config/rofi/geminios.rasi

# Terminal (only on explicit request)
bind = $mainMod SHIFT, RETURN, exec, foot

# Window management
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Workspace navigation
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Voice assistant
bind = $mainMod, A, exec, /usr/local/bin/gemini-voice-trigger

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Logout/Exit (guarded)
bind = $mainMod SHIFT, M, exit,
