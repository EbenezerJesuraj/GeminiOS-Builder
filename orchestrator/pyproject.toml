[project]
name = "gemini-orchestrator"
version = "0.1.0"
description = "Gemini OS — Central AI Orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "grpcio>=1.59.0",
    "protobuf>=4.25.0",
    "pyyaml>=6.0",
]

[project.scripts]
gemini-orchestrator = "src.orchestrator:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
